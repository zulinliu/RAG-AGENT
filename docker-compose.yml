version: "3.9"

services:
  # ─── PostgreSQL 17 ────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: rag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ─── Milvus 2.6 (Standalone) ────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  minio-storage:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: rag-minio-storage
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  milvus-standalone:
    image: milvusdb/milvus:v2.6.0
    container_name: rag-milvus
    restart: unless-stopped
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio-storage:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ─── Elasticsearch 8.19 ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: rag-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: rag-cluster
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rag-network

  # ─── Redis 7 ─────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ragagent123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ─── MinIO (Application) ─────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: rag-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ─── Backend (FastAPI) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rag_agent
      REDIS_URL: redis://:${REDIS_PASSWORD:-ragagent123}@redis:6379/0
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: "19530"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: rag-docs
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_API_BASE: ${LLM_API_BASE:-http://localhost:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Qwen2.5-72B-Instruct}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      # Embedding
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://embedding-worker:8100}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-large-zh-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # Reranker
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
      RERANKER_API_URL: ${RERANKER_API_URL:-http://embedding-worker:8100/rerank}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      RERANKER_THRESHOLD: ${RERANKER_THRESHOLD:-0.3}
      # Auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-use-strong-secret-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rag-network

  # ─── Celery Worker ──────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-celery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rag_agent
      REDIS_URL: redis://:${REDIS_PASSWORD:-ragagent123}@redis:6379/0
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: "19530"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: rag-docs
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_API_BASE: ${LLM_API_BASE:-http://localhost:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Qwen2.5-72B-Instruct}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      # Embedding
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://embedding-worker:8100}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-large-zh-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # Reranker
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
      RERANKER_API_URL: ${RERANKER_API_URL:-http://embedding-worker:8100/rerank}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      RERANKER_THRESHOLD: ${RERANKER_THRESHOLD:-0.3}
      # Auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-use-strong-secret-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    networks:
      - rag-network

  # ─── Embedding Worker ───────────────────────────────────────────────
  embedding-worker:
    image: ${EMBEDDING_WORKER_IMAGE:-rag-agent/embedding-worker:latest}
    container_name: rag-embedding-worker
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      MODEL_NAME: bge-large-zh-v1.5
      MODEL_DIR: /models
    volumes:
      - embedding_models:/models
    networks:
      - rag-network

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  es_data:
  milvus_data:
  milvus_minio_data:
  etcd_data:
  minio_data:
  embedding_models:

# ─── Network ──────────────────────────────────────────────────────────
networks:
  rag-network:
    driver: bridge
