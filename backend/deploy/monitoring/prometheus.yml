global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-server"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-server:8000"]

  - job_name: "worker"
    static_configs:
      - targets: ["worker:9090"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "elasticsearch"
    static_configs:
      - targets: ["es-exporter:9114"]

  - job_name: "milvus"
    static_configs:
      - targets: ["milvus-standalone:9091"]
