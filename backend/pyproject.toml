[project]
name = "rag-agent"
version = "0.1.0"
description = "Enterprise multi-source RAG knowledge Q&A system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.18.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.3.0",
    "redis>=5.0.0",
    "celery[redis]>=5.6.0",
    "pymilvus>=3.0.0",
    "elasticsearch[async]>=8.19.0",
    "httpx>=0.28.0",
    "pyjwt>=2.12.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.0",
    "structlog",
    "sse-starlette>=3.4.0",
    "FlagEmbedding>=1.4.0",
    "magic-pdf[full]>=1.3.0",
    "paddleocr>=3.5.0",
    "unstructured>=0.22.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pandas>=3.0.0",
    "jieba>=0.42.0",
    "llama-index>=0.14.0",
    "langgraph>=1.2.0",
    "ragas>=0.4.0",
    "watchdog>=6.0.0",
    "pysmb>=1.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
