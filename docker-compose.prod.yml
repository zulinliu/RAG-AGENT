version: "3.9"

# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  etcd:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  minio-storage:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  milvus-standalone:
    restart: always
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  elasticsearch:
    restart: always
    environment:
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    restart: always
    environment:
      ENVIRONMENT: prod
      LOG_LEVEL: WARNING
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  celery-worker:
    restart: always
    environment:
      ENVIRONMENT: prod
      LOG_LEVEL: WARNING
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  embedding-worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
