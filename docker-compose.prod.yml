version: "3.9"

# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    ports: !override
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  etcd:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  minio-storage:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  milvus-standalone:
    restart: always
    ports: !override
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  elasticsearch:
    restart: always
    ports: !override
      - "127.0.0.1:9200:9200"
    environment:
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  redis:
    restart: always
    ports: !override
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  minio:
    restart: always
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Embedding Worker (CPU) ──────────────────────────────────────────
  # bge-large-zh-v1.5: ~1.2GB model + ~2GB runtime = ~3GB total
  embedding-worker:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ─── Reranker Worker (CPU) ───────────────────────────────────────────
  # bge-reranker-v2-m3: ~1.1GB model + ~2GB runtime = ~3GB total
  reranker-worker:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  backend:
    restart: always
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: prod
      LOG_LEVEL: WARNING
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  celery-worker:
    restart: always
    environment:
      ENVIRONMENT: prod
      LOG_LEVEL: WARNING
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
