# ─── Network ────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ─── Authentication ─────────────────────────────────────────────────
# requirepass is set via command line from docker-compose environment
# using the REDIS_PASSWORD variable. Do not set it here.

# ─── Memory ─────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ─── Persistence ────────────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── Logging ────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ─── General ────────────────────────────────────────────────────────
databases 16
always-show-logo no
